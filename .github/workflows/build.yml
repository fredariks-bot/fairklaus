name: build

on:
  pull_request:
  push:
    branches:
      - main
      - 'vibe/**'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (inkl. vst3sdk-Submodul)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: GUI-Abhängigkeiten installieren (VSTGUI-Editor)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcb1-dev libxcb-util-dev libxcb-keysyms1-dev \
            libxcb-cursor-dev libxcb-xkb-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libglib2.0-dev libcairo2-dev libpango1.0-dev \
            libfreetype-dev libfontconfig-dev libgtkmm-3.0-dev xvfb

      - name: CMake konfigurieren
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Bauen
        run: cmake --build build -j "$(nproc)"

      - name: Tests (DSP + Host-Simulation)
        run: cd build && ctest --output-on-failure

      - name: VST3 SDK Validator
        run: ./build/bin/Release/validator "build/VST3/Release/PunishChild 670.vst3"

      - name: Plugin-Bundle als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: PunishChild-670-vst3-linux-x64
          path: build/VST3/Release/PunishChild 670.vst3

  #--- Windows x64 (MSVC) ------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout (inkl. vst3sdk-Submodul)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: CMake konfigurieren
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Bauen
        run: cmake --build build --config Release -j

      - name: Tests (DSP)
        run: cd build && ctest -C Release --output-on-failure

      - name: VST3 SDK Validator
        shell: pwsh
        run: |
          $v = Get-ChildItem -Recurse build -Filter validator.exe | Select-Object -First 1
          & $v.FullName "build/VST3/Release/PunishChild 670.vst3"

      - name: Windows-VST3 als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: PunishChild-670-vst3-windows-x64
          path: build/VST3/Release/PunishChild 670.vst3
